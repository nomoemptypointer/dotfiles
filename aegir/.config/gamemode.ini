[general]
; Increase CPU governor aggressiveness
renice = 10
softrealtime = yes
softrealtime_limit = 98

[supervisor]
; Use gamemoderun's built-in supervisor mode (optional but useful for fallback)
reaper = yes

[cpu]
; Force performance governor for max CPU boost
governor = performance
reset_on_exit = yes

[io]
; Use ionice to prioritize game IO
iomask = bf
ioprio = 0
ioprio_class = 2

[gpu]
; Apply AMD GPU optimizations
vendor = amd
; Adjust performance level: "high" will force max clocks
; Only works on cards with DPM support (like yours)
performance_mode = high
; Reset back on exit
reset_on_exit = yes

[scripts]
; Run custom scripts if needed (e.g., reduce screen tearing or boost clocks)
start = notify-send "GameMode Enabled"
end = notify-send "GameMode Disabled"

[custom]
; Optional: temporarily disable compositing (can help with latency in some cases)
; start = hyprctl dispatch "keyword animations:enabled false"
; end = hyprctl dispatch "keyword animations:enabled true"
