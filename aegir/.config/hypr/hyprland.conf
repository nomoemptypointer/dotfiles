#debug:disable_logs = false

# Monitors
monitor=,preferred,auto,1

# Program variables
$terminal = kitty
$fileManager = dolphin
$menu = rofi \
    -show drun \
    -theme ~/.config/rofi/colors.rasi

$lock = swaylock \
	--screenshots \
	--clock \
	--indicator \
	--indicator-radius 100 \
	--indicator-thickness 7 \
	--effect-blur 14x10 \
	--effect-vignette 0.7:0.7 \
	--ring-color bb00cc \
	--key-hl-color 880033 \
	--line-color 00000000 \
	--inside-color 00000088 \
	--separator-color 00000000

# Startup
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar & swww-daemon & swaync
exec-once = steam -silent
exec-once = discord --start-minimized
exec-once = obs --disable-shutdown-check --disable-missing-files-check --minimize-to-tray --startreplaybuffer

# envtables
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = MOZ_ENABLE_WAYLAND,1
env = xGBDK_HOME,/home/memfrag/gpdk/
env = QT_QPA_PLATFORMTHEME,qt6ct
exec = gsettings set org.gnome.desktop.interface color-scheme "prefer-dark"

# Permissions
# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# Decorations and feel
general {
    gaps_in = 3
    gaps_out = 3
    border_size = 2

    col.active_border = rgba(610094d9) rgba(30005cd9) 135deg
    col.inactive_border = rgba(595959aa)

    resize_on_border = false
    allow_tearing = true # VSync off
    layout = dwindle
}

decoration {
    rounding = 4
    rounding_power = 4

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# Input
input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# Keybinding
$mainMod = SUPER
bind = $mainMod, Q, exec, $terminal
bind = ALT, F4, killactive,
bind = $mainMod, F, fullscreen
bind = $mainMod, M, exit,
bind = $mainMod, P, exec, swaylock & sleep 1 && systemctl suspend
#bind = $mainMod, E, exec, $fileManager # This pisses me off
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
#bind = $mainMod, P, pseudo, # i do not use dwindle
#bind = $mainMod, J, togglesplit, # i do not use dwindle
bind = $mainMod, L, exec, $lock

# We need to pass OBS keybindings because I can't clip when I operate in a workspace that has no OBS in it
bind = Alt, F10, pass, class:^(com\.obsproject\.Studio)$
bind = Alt, X, pass, class:^(com\.obsproject\.Studio)$

bind =, Print, exec, grim - | wl-copy # Screenshot everything
bind = ALT, Print, exec, grim -g "$(slurp)" - | wl-copy # Screenshot area

bind = SUPER,N,exec,swaync-client -t # Notifications

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
#bind = $mainMod, mouse_down, workspace, e+1
#bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Window rulessss
windowrule = suppressevent maximize, class:.* # Ignore maximize requests from apps. You'll probably like this.
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0 # XWayland fix

# Gamescope compositor tweaks
windowrule = fullscreen, class:gamescope
windowrule = immediate, class:gamescope
windowrule = syncfullscreen, class:gamescope

windowrule = opacity 0.75 0.5, class:kitty
windowrule = opacity 0.75 0.5, class:schismtracker
windowrule = animation popin, class:kitty
windowrule = opacity 0.95 0.75, class:Code
windowrule = opacity 0.75, title:Wasabi

# Those windows should float by default
windowrule = float, class:rofi
#windowrule = float, class:steam
windowrule = float, class:org.pulseaudio.pavucontrol
windowrule = float, class:blueman-manager

# We need to disable compositioning for osu! (Probably for lazer too, but I don't care since I don't use lazer)
windowrulev2 = immediate, class:^(osu!.exe)
